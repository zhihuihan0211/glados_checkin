name: run

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: 10 16 * * *

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
          # 保持关闭，避免仓库已有变量意外开启兑换。
          AUTO_EXCHANGE: 'false'
          EXCHANGE_THRESHOLD: ${{ vars.EXCHANGE_THRESHOLD || '500' }}
